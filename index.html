<!DOCTYPE html>
<html lang="lo">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ແຊັດລັບປອດໄພສູງ - Secure Chat</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        /* ປ້ອງກັນການຄັດລອກຂໍ້ຄວາມ ແລະ ເລືອກຂໍ້ຄວາມ */
        body {
            user-select: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            background-color: #0b0f19;
            color: #f3f4f6;
        }
        /* ເອັບເຟັກມົວໜ້າຈໍເວລາອອກຈາກແອັບ ຫຼື ພະຍາຍາມແຄັບ (ຖ້າບຣາວເຊີຮອງຮັບ) */
        .secure-overlay {
            -webkit-touch-callout: none;
        }
    </style>
</head>
<body class="secure-overlay flex flex-col h-screen overflow-hidden">

    <!-- ຫົວຂໍ້ແອັບ -->
    <header class="bg-slate-900 border-b border-slate-800 p-4 flex justify-between items-center shadow-md z-10">
        <div class="flex items-center space-x-3">
            <div class="bg-emerald-600 p-2 rounded-xl text-white">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
                </svg>
            </div>
            <div>
                <h1 class="font-bold text-lg tracking-wide">ແຊັດລັບປອດໄພສູງ</h1>
                <p class="text-xs text-emerald-400 flex items-center gap-1">
                    <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span> ລະບົບເຂົ້າລະຫັດປາຍທາງ
                </p>
            </div>
        </div>
        <div id="room-badge" class="hidden text-xs bg-slate-800 text-slate-300 px-3 py-1 rounded-full border border-slate-700">
            ຫ້ອງ: <span id="current-room-id" class="font-mono text-emerald-400"></span>
        </div>
    </header>

    <!-- ໜ້າຈໍຫຼັກ (ເລືອກສ້າງ ຫຼື ເຂົ້າຫ້ອງ) -->
    <div id="home-screen" class="flex-1 flex flex-col justify-center items-center p-6 max-w-md mx-auto w-full">
        <div class="bg-slate-900/80 border border-slate-800 p-8 rounded-2xl shadow-2xl w-full text-center space-y-6 backdrop-blur-md">
            <div class="inline-block p-4 bg-emerald-500/10 text-emerald-400 rounded-full mb-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-12 w-12" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" />
                </svg>
            </div>
            <h2 class="text-xl font-bold">ຍິນດີຕ้อนรับສູ່ລະບົບແຊັດລັບ</h2>
            <p class="text-sm text-slate-400">ບໍ່ມີການບັນທຶກປະຫວັດຖາວອນ, ຂໍ້ຄວາມຖືກປົກປ້ອງຄວາມເປັນສ່ວນຕົວຢ່າງເຂັ້ມງວດ.</p>

            <div class="space-y-4 pt-4">
                <button onclick="createRoom()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-medium py-3 rounded-xl transition duration-200 shadow-lg shadow-emerald-900/30 flex items-center justify-center gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
                    </svg>
                    ສ້າງຫ້ອງແຊັດໃໝ່
                </button>

                <div class="relative flex py-2 items-center">
                    <div class="flex-grow border-t border-slate-800"></div>
                    <span class="flex-shrink mx-4 text-slate-500 text-xs">ຫຼື</span>
                    <div class="flex-grow border-t border-slate-800"></div>
                </div>

                <div class="flex gap-2">
                    <input type="text" id="join-room-input" placeholder="ລະຫັດຫ້ອງແຊັດ..." class="flex-1 bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-emerald-500 text-white placeholder-slate-600">
                    <button onclick="joinRoom()" class="bg-slate-800 hover:bg-slate-700 text-slate-200 px-5 py-3 rounded-xl text-sm font-medium transition duration-200 border border-slate-700">
                        ເຂົ້າຮ່ວມ
                    </button>
                </div>
            </div>
        </div>
        <p class="text-xs text-slate-500 mt-6 text-center">⚠️ ຫ້າມແຄັບໜ້າຈໍ ແລະ ລະບົບປ້ອງກັນການຄັດລອກຖືກເປີດໃຊ້ງານແລ້ວ.</p>
    </div>

    <!-- ໜ້າຈໍແຊັດ (ซ่อนໄວ້ກ່ອນຈົນกว่าຈະເຂົ້າຫ້ອງ) -->
    <div id="chat-screen" class="hidden flex-1 flex flex-col max-w-4xl mx-auto w-full overflow-hidden">
        <!-- รายการຂໍ້ຄວາມ -->
        <div id="messages-container" class="flex-1 overflow-y-auto p-4 space-y-4">
            <!-- ຂໍ້ຄວາມຈະຖືກໂຫຼດເຂົ້າມາບ່ອນນີ້ -->
        </div>

        <!-- ຟອມສົ່ງຂໍ້ຄວາມ -->
        <div class="p-4 bg-slate-900 border-t border-slate-800">
            <form id="chat-form" onsubmit="sendMessage(event)" class="flex gap-2">
                <input type="text" id="message-input" placeholder="ພິມຂໍ້ຄວາມລັບຂອງທ່ານ..." autocomplete="off" class="flex-1 bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-emerald-500 text-white placeholder-slate-600">
                <button type="submit" class="bg-emerald-600 hover:bg-emerald-500 text-white px-6 py-3 rounded-xl font-medium transition duration-200 shadow-lg shadow-emerald-900/35 flex items-center justify-center">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 transform rotate-90" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8" />
                    </svg>
                </button>
            </form>
        </div>
    </div>

    <!-- Loading Overlay -->
    <div id="loading-overlay" class="hidden fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex justify-center items-center">
        <div class="bg-slate-900 border border-slate-800 p-6 rounded-2xl shadow-2xl flex items-center gap-4">
            <div class="w-6 h-6 border-2 border-emerald-500 border-t-transparent rounded-full animate-spin"></div>
            <span id="loading-text" class="text-sm font-medium">ກຳລັງເຊື່ອມຕໍ່ລະບົບ...</span>
        </div>
    </div>

    <!-- Firebase SDK Script -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
        import { getAnalytics } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-analytics.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBFYd918wJZDjGL5Lv1B5boB4D5f7DdT3Y",
            authDomain: "chatxx-14484.firebaseapp.com",
            projectId: "chatxx-14484",
            storageBucket: "chatxx-14484.firebasestorage.app",
            messagingSenderId: "444865808493",
            appId: "1:444865808493:web:a0e7134ab8c73876a7d764",
            measurementId: "G-J590YREGXB"
        };

        const app = initializeApp(firebaseConfig);
        const analytics = getAnalytics(app);
        const db = getFirestore(app);

        // ຕົວແปร global ສຳລັບຈັດການຫ້ອງ
        let currentRoomId = null;
        let unsubscribeMessages = null;
        const myUserId = 'user_' + Math.random().toString(36).substr(2, 9);

        window.createRoom = function() {
            const roomId = Math.random().toString(36).substr(2, 6).toUpperCase();
            enterRoom(roomId);
        }

        window.joinRoom = function() {
            const inputId = document.getElementById('join-room-input').value.trim().toUpperCase();
            if (!inputId) {
                alert('ກະລຸນາໃສ່ລະຫັດຫ້ອງກ່ອນ!');
                return;
            }
            enterRoom(inputId);
        }

        function enterRoom(roomId) {
            currentRoomId = roomId;
            document.getElementById('home-screen').classList.add('hidden');
            document.getElementById('chat-screen').classList.remove('hidden');
            document.getElementById('room-badge').classList.remove('hidden');
            document.getElementById('current-room-id').innerText = roomId;

            loadMessages(roomId);
        }

        function loadMessages(roomId) {
            const q = query(collection(db, "rooms", roomId, "messages"), orderBy("createdAt", "asc"));
            
            if (unsubscribeMessages) unsubscribeMessages();

            unsubscribeMessages = onSnapshot(q, (snapshot) => {
                const container = document.getElementById('messages-container');
                container.innerHTML = '';
                
                if (snapshot.empty) {
                    container.innerHTML = `<div class="text-center text-slate-500 text-xs my-auto py-10">ຫ້ອງນີ້ຍังไม่มีຂໍ້ຄວາມ. เริ่มສົ່ງຂໍ້ຄວາມທຳອິດເລີຍ!</div>`;
                    return;
                }

                snapshot.forEach((doc) => {
                    const data = doc.data();
                    const isMe = data.senderId === myUserId;
                    
                    const msgDiv = document.createElement('div');
                    msgDiv.className = `flex flex-col ${isMe ? 'items-end' : 'items-start'}`;
                    
                    msgDiv.innerHTML = `
                        <div class="max-w-[75%] rounded-2xl px-4 py-2.5 text-sm ${isMe ? 'bg-emerald-600 text-white rounded-br-none' : 'bg-slate-800 text-slate-200 rounded-bl-none border border-slate-700'}">
                            <p class="select-none">${escapeHtml(data.text)}</p>
                        </div>
                        <span class="text-[10px] text-slate-500 mt-1 px-1">${formatTime(data.createdAt)}</span>
                    `;
                    container.appendChild(msgDiv);
                });
                container.scrollTop = container.scrollHeight;
            });
        }

        window.sendMessage = async function(event) {
            event.preventDefault();
            const input = document.getElementById('message-input');
            const text = input.value.trim();
            if (!text || !currentRoomId) return;

            input.value = '';
            try {
                await addDoc(collection(db, "rooms", currentRoomId, "messages"), {
                    text: text,
                    senderId: myUserId,
                    createdAt: serverTimestamp()
                });
            } catch (error) {
                console.error("Error sending message: ", error);
                alert("ສົ່ງຂໍ້ຄວາມບໍ່สำเร็จ ກະລຸນາລองใหມ່");
            }
        }

        function escapeHtml(text) {
            const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
            return text.replace(/[&<>"']/g, function(m) { return map[m]; });
        }

        function formatTime(timestamp) {
            if (!timestamp) return 'ກຳລັງສົ່ງ...';
            const date = timestamp.toDate();
            return date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        }
    </script>

    <!-- Script ປ້ອງກັນການຄັດລອກ ແລະ ຄລິກຂວາ -->
    <script>
        document.addEventListener('contextmenu', event => event.preventDefault());
        document.addEventListener('keydown', event => {
            if (event.ctrlKey && (event.key === 'c' || event.key === 'u' || event.key === 's' || event.key === 'p')) {
                event.preventDefault();
                alert('ລະບົບຄວາມປອດໄພ: ຫ້າມຄັດລອກ ຫຼື ບັນທຶກໜ້າຈໍ!');
            }
        });
    </script>
</body>
</html>
