<!DOCTYPE html>
<html lang="lo">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ແຊັດລັບສຳລັບສອງຄົນ - Secure Private Chat</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        body {
            user-select: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            background-color: #1a0b14;
            color: #f3f4f6;
            margin: 0;
            padding: 0;
        }
        .secure-overlay {
            -webkit-touch-callout: none;
        }
    </style>
</head>
<body class="secure-overlay flex flex-col h-[100dvh] overflow-hidden">

    <!-- ຫົວຂໍ້ແອັບ -->
    <header class="bg-slate-900/90 border-b border-pink-900/50 p-3 flex justify-between items-center shadow-md shrink-0 z-10 backdrop-blur-md">
        <div class="flex items-center space-x-2">
            <div class="bg-pink-600 p-1.5 rounded-xl text-white shadow-lg shadow-pink-900/50">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z" />
                </svg>
            </div>
            <div>
                <h1 class="font-bold text-sm tracking-wide text-pink-200">ແຊັດລັບສອງຄົນ</h1>
                <p id="partner-status" class="text-[10px] text-pink-400 flex items-center gap-1">
                    <span class="w-1.5 h-1.5 rounded-full bg-slate-500" id="status-dot"></span> 
                    <span id="status-text">ພ້ອມໃຊ້ງານ</span>
                </p>
            </div>
        </div>

        <div class="flex items-center gap-2">
            <button onclick="startCall('audio')" class="bg-pink-600/25 hover:bg-pink-600/40 text-pink-300 p-2 rounded-xl transition border border-pink-500/30" title="ໂທສຽງ">📞</button>
            <button onclick="startCall('video')" class="bg-pink-600/25 hover:bg-pink-600/40 text-pink-300 p-2 rounded-xl transition border border-pink-500/30" title="ໂທວິດີໂອ">📹</button>
            <div id="room-badge" class="hidden text-xs bg-pink-950/60 text-pink-200 px-2.5 py-1 rounded-full border border-pink-800/60">
                ຫ້ອງ: <span id="current-room-id" class="font-mono text-pink-400 font-bold"></span>
            </div>
        </div>
    </header>

    <!-- ແຖບປັກໝຸດ -->
    <div id="pinned-banner" class="hidden bg-pink-950/90 border-b border-pink-800/50 px-4 py-2 text-xs text-pink-200 flex justify-between items-center shrink-0 backdrop-blur-md z-10">
        <div class="flex items-center gap-2 truncate">
            <span class="text-pink-400 font-bold">📌 ປັກໝຸດ:</span>
            <span id="pinned-text" class="truncate">ຍັງບໍ່ມີຂໍ້ຄວາມປັກໝຸດ</span>
        </div>
        <button onclick="unpinMessage()" class="text-pink-400 hover:text-red-400 text-[10px] ml-2 shrink-0">ຍົກເລີກ</button>
    </div>

    <!-- ໜ້າຈໍຫຼັກ -->
    <div id="home-screen" class="flex-1 flex flex-col justify-center items-center p-6 max-w-md mx-auto w-full overflow-y-auto">
        <div class="bg-slate-900/80 border border-pink-900/40 p-6 rounded-2xl shadow-2xl w-full text-center space-y-5 backdrop-blur-md">
            <div class="inline-block p-3 bg-pink-500/10 text-pink-400 rounded-full mb-1">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
                </svg>
            </div>
            <h2 class="text-lg font-bold text-pink-200">ພື້ນທີ່ສ່ວນຕົວ</h2>
            <p class="text-xs text-slate-400">ສຳລັບທ່ານ ແລະ ກິກຂອງທ່ານເທົ່ານັ້ນ (1 ລະຫັດ ຕໍ່ 2 ເຄື່ອງ)</p>

            <div class="space-y-3 pt-2">
                <button onclick="createRoom()" class="w-full bg-pink-600 hover:bg-pink-500 text-white font-medium py-2.5 rounded-xl transition duration-200 shadow-lg shadow-pink-900/40 flex items-center justify-center gap-2 text-sm">
                    ສ້າງຫ້ອງລັບ (ຮັບລະຫັດ 6 ຫຼັກ)
                </button>

                <div class="relative flex py-1 items-center">
                    <div class="flex-grow border-t border-pink-900/40"></div>
                    <span class="flex-shrink mx-3 text-slate-500 text-[10px]">ຫຼື ໃສ່ລະຫັດເຂົ້າຮ່ວມ</span>
                    <div class="flex-grow border-t border-pink-900/40"></div>
                </div>

                <div class="flex gap-2">
                    <input type="text" id="join-room-input" maxlength="6" placeholder="ລະຫັດ 6 ຕົວເລກ..." class="flex-1 bg-slate-950 border border-pink-900/50 rounded-xl px-3 py-2.5 text-xs focus:outline-none focus:border-pink-500 text-white placeholder-slate-600 uppercase font-mono tracking-widest text-center">
                    <button onclick="joinRoom()" class="bg-pink-950/80 hover:bg-pink-900 text-pink-200 px-4 py-2.5 rounded-xl text-xs font-medium transition duration-200 border border-pink-800/50">ເຂົ້າຫ້ອງ</button>
                </div>
            </div>
        </div>
    </div>

    <!-- ໜ້າຈໍແຊັດ -->
    <div id="chat-screen" class="hidden flex-1 flex flex-col w-full overflow-hidden relative bg-[#200d17]">
        <div id="messages-container" class="flex-1 overflow-y-auto p-4 space-y-3 pb-20"></div>

        <!-- ຟອມສົ່ງຂໍ້ຄວາມ -->
        <div class="p-3 bg-slate-900/90 border-t border-pink-900/40 shrink-0 flex items-center gap-2 backdrop-blur-md">
            <button type="button" onclick="sendLocation()" class="bg-pink-950/60 hover:bg-pink-900 text-pink-300 p-2.5 rounded-xl transition border border-pink-800/40" title="ສົ່ງໂລເຄຊັນ">📍</button>

            <form id="chat-form" onsubmit="sendMessage(event)" class="flex-1 flex gap-2">
                <input type="text" id="message-input" placeholder="ພິມຂໍ້ຄວາມ..." autocomplete="off" oninput="updateTypingStatus(true)" onblur="updateTypingStatus(false)" class="flex-1 bg-slate-950 border border-pink-900/50 rounded-xl px-3.5 py-2.5 text-xs sm:text-sm focus:outline-none focus:border-pink-500 text-white placeholder-slate-500">
                
                <button type="submit" class="bg-pink-600 hover:bg-pink-500 text-white px-4 py-2.5 rounded-xl font-medium transition shadow-lg shadow-pink-900/40 flex items-center justify-center shrink-0">🚀</button>
            </form>
        </div>
    </div>

    <!-- Firebase SDK (ໃຊ້ສະເພາະ Firestore ຟຣີ 100%) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
        import { getFirestore, doc, getDoc, setDoc, updateDoc, collection, addDoc, deleteDoc, onSnapshot, query, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBFYd918wJZDjGL5Lv1B5boB4D5f7DdT3Y",
            authDomain: "chatxx-14484.firebaseapp.com",
            projectId: "chatxx-14484",
            storageBucket: "chatxx-14484.firebasestorage.app",
            messagingSenderId: "444865808493",
            appId: "1:444865808493:web:a0e7134ab8c73876a7d764",
            measurementId: "G-J590YREGXB"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let currentRoomId = null;
        let unsubscribeMessages = null;
        let unsubscribeRoom = null;

        let myDeviceId = localStorage.getItem('secure_device_id');
        if (!myDeviceId) {
            myDeviceId = 'dev_' + Math.random().toString(36).substr(2, 9);
            localStorage.setItem('secure_device_id', myDeviceId);
        }

        window.addEventListener('DOMContentLoaded', () => {
            const savedRoom = localStorage.getItem('active_room_id');
            if (savedRoom) verifyAndEnterRoom(savedRoom, true);
        });

        window.createRoom = async function() {
            const roomId = Math.floor(100000 + Math.random() * 900000).toString();
            try {
                await setDoc(doc(db, "rooms", roomId), { 
                    createdAt: serverTimestamp(), 
                    allowedDevices: [myDeviceId],
                    typing: {},
                    lastSeen: {},
                    pinnedMessage: null
                });
                localStorage.setItem('active_room_id', roomId);
                enterChatScreen(roomId);
            } catch (e) {
                console.error(e);
                alert("ສ້າງຫ້ອງບໍ່ໄດ້: " + e.message);
            }
        }

        window.joinRoom = function() {
            const roomId = document.getElementById('join-room-input').value.trim();
            if (roomId.length !== 6) return alert('ກະລຸນາໃສ່ລະຫັດ 6 ຕົວ!');
            verifyAndEnterRoom(roomId, false);
        }

        async function verifyAndEnterRoom(roomId, isAuto) {
            const roomRef = doc(db, "rooms", roomId);
            try {
                const snap = await getDoc(roomRef);
                if (!snap.exists()) {
                    if (!isAuto) alert('ບໍ່ພົບຫ້ອງ!');
                    localStorage.removeItem('active_room_id');
                    return;
                }
                let data = snap.data();
                let devices = data.allowedDevices || [];
                if (!devices.includes(myDeviceId)) {
                    if (devices.length >= 2) {
                        alert('❌ ຫ້ອງເຕັມແລ້ວ (2 ຄົນ)');
                        localStorage.removeItem('active_room_id');
                        return;
                    }
                    devices.push(myDeviceId);
                    await updateDoc(roomRef, { allowedDevices: devices });
                }
                localStorage.setItem('active_room_id', roomId);
                enterChatScreen(roomId);
            } catch (e) { 
                console.error(e);
                if (!isAuto) alert('ເກີດຂໍ້ຜິດพลาดในการເຂົ້າຫ້ອງ');
            }
        }

        function enterChatScreen(roomId) {
            currentRoomId = roomId;
            document.getElementById('home-screen').classList.add('hidden');
            document.getElementById('chat-screen').classList.remove('hidden');
            document.getElementById('room-badge').classList.remove('hidden');
            document.getElementById('current-room-id').innerText = roomId;
            
            loadMessages(roomId);
            monitorRoomStatus(roomId);
            updateOnlineStatus(true);

            window.addEventListener('beforeunload', () => updateOnlineStatus(false));
        }

        function monitorRoomStatus(roomId) {
            const roomRef = doc(db, "rooms", roomId);
            if (unsubscribeRoom) unsubscribeRoom();

            unsubscribeRoom = onSnapshot(roomRef, (docSnap) => {
                if (!docSnap.exists()) return;
                const data = docSnap.data();
                const typingObj = data.typing || {};
                const lastSeenObj = data.lastSeen || {};
                const pinned = data.pinnedMessage;

                const banner = document.getElementById('pinned-banner');
                const pinnedText = document.getElementById('pinned-text');
                if (pinned) {
                    banner.classList.remove('hidden');
                    pinnedText.innerText = pinned;
                } else {
                    banner.classList.add('hidden');
                }

                let isPartnerTyping = false;
                let partnerLastSeenTime = null;
                let partnerOnline = false;

                for (let devId in typingObj) {
                    if (devId !== myDeviceId && typingObj[devId]) isPartnerTyping = true;
                }
                for (let devId in lastSeenObj) {
                    if (devId !== myDeviceId) {
                        partnerOnline = lastSeenObj[devId].online;
                        partnerLastSeenTime = lastSeenObj[devId].time;
                    }
                }

                const statusText = document.getElementById('status-text');
                const statusDot = document.getElementById('status-dot');

                if (isPartnerTyping) {
                    statusText.innerText = "ກຳລັງພິມ...";
                    statusDot.className = "w-1.5 h-1.5 rounded-full bg-pink-400 animate-ping";
                } else if (partnerOnline) {
                    statusText.innerText = "ອອນລາຍຢູ່";
                    statusDot.className = "w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse";
                } else if (partnerLastSeenTime) {
                    const timeStr = partnerLastSeenTime.toDate().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                    statusText.innerText = `ເຫັນລ່າສຸດ ${timeStr}`;
                    statusDot.className = "w-1.5 h-1.5 rounded-full bg-slate-500";
                } else {
                    statusText.innerText = "ອອບລາຍ";
                    statusDot.className = "w-1.5 h-1.5 rounded-full bg-slate-500";
                }
            });
        }

        async function updateOnlineStatus(isOnline) {
            if (!currentRoomId) return;
            try {
                await updateDoc(doc(db, "rooms", currentRoomId), {
                    [`lastSeen.${myDeviceId}`]: { online: isOnline, time: serverTimestamp() }
                });
            } catch (e) {}
        }

        window.updateTypingStatus = async function(isTyping) {
            if (!currentRoomId) return;
            try {
                await updateDoc(doc(db, "rooms", currentRoomId), { [`typing.${myDeviceId}`]: isTyping });
            } catch (e) {}
        }

        function loadMessages(roomId) {
            const q = query(collection(db, "rooms", roomId, "messages"), orderBy("createdAt", "asc"));
            if (unsubscribeMessages) unsubscribeMessages();

            unsubscribeMessages = onSnapshot(q, (snapshot) => {
                const container = document.getElementById('messages-container');
                container.innerHTML = '';
                if (snapshot.empty) {
                    container.innerHTML = `<div class="text-center text-pink-400/60 text-xs my-auto py-10">ເລີ່ມຕົ້ນສົນທະນາກັນເລີຍ...</div>`;
                    return;
                }

                snapshot.forEach((docSnap) => {
                    const data = docSnap.data();
                    const docId = docSnap.id;
                    const isMe = data.deviceId === myDeviceId;
                    
                    let contentHTML = `<p class="select-none">${escapeHtml(data.text || '')}</p>`;
                    if (data.type === 'location') contentHTML = `<a href="${data.url}" target="_blank" class="text-pink-200 underline font-bold">📍 ເບິ່ງໂລເຄຊັນໃນແຜນທີ່</a>`;

                    let reactionsHTML = '';
                    if (data.reactions) {
                        for (let dev in data.reactions) {
                            reactionsHTML += `<span class="bg-pink-950/80 border border-pink-800 text-[10px] px-1.5 py-0.5 rounded-full ml-1">${data.reactions[dev]}</span>`;
                        }
                    }

                    let seenStatus = isMe ? (data.read ? '<span class="text-pink-300 font-bold ml-1">✓✓ ອ່ານແລ້ວ</span>' : '<span class="text-slate-400 ml-1">✓ ສົ່ງແລ້ວ</span>') : '';

                    if (!isMe && !data.read) markAsRead(docId);

                    const msgDiv = document.createElement('div');
                    msgDiv.className = `flex flex-col ${isMe ? 'items-end' : 'items-start'}`;
                    msgDiv.innerHTML = `
                        <div class="flex items-center gap-2 ${isMe ? 'flex-row-reverse' : 'flex-row'} group relative">
                            <div class="max-w-[75%] rounded-2xl px-3.5 py-2 text-xs sm:text-sm ${isMe ? 'bg-pink-600 text-white rounded-br-none shadow-md' : 'bg-pink-950/80 text-pink-100 rounded-bl-none border border-pink-900/60'} relative">
                                ${contentHTML}
                                <div class="absolute -bottom-2 ${isMe ? 'left-0' : 'right-0'} flex">${reactionsHTML}</div>
                            </div>
                            
                            <div class="flex items-center gap-1 opacity-80 sm:opacity-0 group-hover:opacity-100 transition">
                                <button onclick="reactMessage('${docId}', '❤️')" title="ຖືກໃຈ">❤️</button>
                                <button onclick="reactMessage('${docId}', '😂')" title="ຫົວ">😂</button>
                                <button onclick="pinMessage('${escapeHtml(data.text || 'ໂລເຄຊັນ')}')" title="ປັກໝຸດ">📌</button>
                                <button onclick="deleteMessage('${docId}')" class="text-red-400" title="ລົບ">🗑️</button>
                            </div>
                        </div>
                        <div class="flex items-center text-[9px] text-pink-400/60 mt-1 px-1">
                            <span>${formatTime(data.createdAt)}</span>
                            ${seenStatus}
                        </div>
                    `;
                    container.appendChild(msgDiv);
                });
                container.scrollTop = container.scrollHeight;
            });
        }

        async function markAsRead(docId) {
            if (!currentRoomId) return;
            try {
                await updateDoc(doc(db, "rooms", currentRoomId, "messages", docId), { read: true });
            } catch (e) {}
        }

        window.reactMessage = async function(docId, emoji) {
            if (!currentRoomId) return;
            const roomRef = doc(db, "rooms", currentRoomId, "messages", docId);
            try {
                const snap = await getDoc(roomRef);
                if (snap.exists()) {
                    let reactions = snap.data().reactions || {};
                    reactions[myDeviceId] = emoji;
                    await updateDoc(roomRef, { reactions: reactions });
                }
            } catch (e) {}
        }

        window.pinMessage = async function(text) {
            if (!currentRoomId) return;
            try {
                await updateDoc(doc(db, "rooms", currentRoomId), { pinnedMessage: text });
            } catch (e) {}
        }

        window.unpinMessage = async function() {
            if (!currentRoomId) return;
            try {
                await updateDoc(doc(db, "rooms", currentRoomId), { pinnedMessage: null });
            } catch (e) {}
        }

        window.sendMessage = async function(event) {
            event.preventDefault();
            const input = document.getElementById('message-input');
            const text = input.value.trim();
            if (!text || !currentRoomId) return;
            input.value = '';
            updateTypingStatus(false);

            await addDoc(collection(db, "rooms", currentRoomId, "messages"), {
                text: text, type: 'text', deviceId: myDeviceId, read: false, createdAt: serverTimestamp()
            });
        }

        window.sendLocation = function() {
            if (!currentRoomId) return;
            if (!navigator.geolocation) return alert('ບຣາວເຊີບໍ່ຮອງຮັບໂລເຄຊັນ');
            navigator.geolocation.getCurrentPosition(async (pos) => {
                const mapUrl = `https://www.google.com/maps?q=${pos.coords.latitude},${pos.coords.longitude}`;
                await addDoc(collection(db, "rooms", currentRoomId, "messages"), {
                    url: mapUrl, type: 'location', deviceId: myDeviceId, read: false, createdAt: serverTimestamp()
                });
            }, () => alert('ບໍ່ສາມາດດຶງໂລເຄຊັນໄດ້'));
        }

        window.deleteMessage = async function(id) {
            if (currentRoomId) await deleteDoc(doc(db, "rooms", currentRoomId, "messages", id));
        }

        window.startCall = function(type) {
            alert(`📞 ກຳລັງເຊື່ອມຕໍ່ ${type === 'audio' ? 'ໂທສຽງ' : 'ໂທວິດີໂອ'} ຫາກິກຂອງທ່ານ...`);
        }

        function escapeHtml(text) {
            const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
            return text.replace(/[&<>"']/g, m => map[m]);
        }

        function formatTime(timestamp) {
            if (!timestamp) return 'ກຳລັງສົ່ງ...';
            return timestamp.toDate().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        }
    </script>
</body>
</html>
